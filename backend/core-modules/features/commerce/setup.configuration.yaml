      -
        id: $PLUGIN_ID
        consumers:
          - id: $CONSUMER_ID
  -
    id: category
    enabled: true
    plugins:
      - 
        id: $PLUGIN_ID
        consumers:
          - id: $CONSUMER_ID
  -
    id: order
    enabled: true
    plugins:
      - 
        id: $PLUGIN_ID
        consumers:
          - id: $CONSUMER_ID
  -
    id: purchase-history
    enabled: true
    plugins:
      - 
        id: $PLUGIN_ID
        consumers:
          - id: $CONSUMER_ID
  -
    id: product
    enabled: true
    plugins:
      - 
        id: $PLUGIN_ID
        consumers:
          - id: $CONSUMER_ID