apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: "{{  .Chart.Name }}"
    chart: '{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}'
  name: "{{  .Chart.Name }}-deployment"
  namespace: "{{ .Values.organization }}"
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  automountServiceAccountToken: false
  restartPolicy: Always
  selector:
    matchLabels:
      app: "{{  .Chart.Name }}"
      version: "current"
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: "{{  .Chart.Name }}"
        version: "current"
    spec:
      securityContext:
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsGroup }}
        runAsNonRoot: {{ .Values.runAsNonRoot }}
      containers:
        - name: "{{  .Chart.Name  }}"
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: {{ .Values.port }}
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          ports:
            - containerPort: {{ .Values.port }}
              protocol: TCP
          resources:
            requests:
              cpu: "{{ .Values.image.resources.requests.cpu }}"
              memory: "{{ .Values.image.resources.requests.memory }}"
          envFrom:
            - configMapRef:
                name: "{{ .Values.appName }}-config-map{{ .Values.configSuffix }}"
          env:
            - name: KUBE_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBE_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KUBE_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PORT
              value: "{{ .Values.port }}"
            - name: ADMIN_PORT
              value: "{{ .Values.adminPort }}"
            # - name: API_ACCESS_CONTROL
            #   valueFrom:
            #     secretKeyRef:
            #       key: binding
            #       name: "api-access-control{{ .Values.configSuffix }}"